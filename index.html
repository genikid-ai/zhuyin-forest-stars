<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>注音符號 挑戰・森林小動物集星星</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="font-sans">
  <!-- 全螢幕響應式繪本舞台（自動適配 65 吋電子白板、平板與手機） -->
  <div id="viewport" class="viewport">
    <div id="stage" class="stage" role="application" aria-label="森林小動物集星星注音小遊戲">

      <!-- ==================== 共用溫暖繪本風森林背景 ==================== -->
      <div class="forest-bg" aria-hidden="true">
        <img class="forest-bg-img" src="assets/bg-forest.jpg" alt="" draggable="false" />
        <div class="sun-glow"></div>

        <!-- 輕柔閃爍星點 -->
        <div class="bg-sparkle s1">✦</div>
        <div class="bg-sparkle s2">✦</div>
        <div class="bg-sparkle s3">★</div>
        <div class="bg-sparkle s4">✦</div>
        <div class="bg-sparkle s5">★</div>
      </div>

      <!-- 彩帶煙火 Canvas（過關時使用） -->
      <canvas id="confetti-canvas" class="confetti-canvas"></canvas>

      <!-- 飛星動畫層 -->
      <div id="fx-layer" class="fx-layer" aria-hidden="true"></div>

      <!-- ==================== 畫面一：首頁（設定與開始） ==================== -->
      <section id="screen-home" class="screen screen-home active" aria-label="首頁設定">
        <!-- 右上工具列 -->
        <div class="top-utility-bar home-utility">
          <button id="btn-font-home" class="util-btn" type="button" title="切換注音字體（黑體 / 標楷體）">
            <span class="util-icon">字</span>
            <span class="util-label font-toggle-label">黑體</span>
          </button>
          <button id="btn-sound-home" class="util-btn sound-toggle-btn" type="button" title="開啟或關閉音效">
            <span class="util-icon sound-icon">🔊</span>
            <span class="util-label sound-label">音效開</span>
          </button>
          <button id="btn-fullscreen-home" class="util-btn fullscreen-btn" type="button" title="切換全螢幕">
            <span class="util-icon">⛶</span>
            <span class="util-label">全螢幕</span>
          </button>
        </div>

        <!-- 標題與迎賓小動物 -->
        <header class="home-header">
          <div class="home-badge">✨ 注音符號 挑戰 ✨</div>
          <h1 class="home-title">
            <span class="title-star">⭐</span>
            森林小動物集星星
            <span class="title-star">⭐</span>
          </h1>
          <p class="home-subtitle">大聲唸出注音符號，一起幫森林小動物收集閃亮星星吧！</p>
        </header>

        <!-- 主設定卡片 -->
        <main class="home-panel">
          <!-- 第一區：選擇注音範圍 -->
          <div class="setting-block">
            <div class="setting-heading">1. 選擇練習範圍</div>
            <div class="scope-grid" role="radiogroup" aria-label="練習範圍">
              <button class="scope-card selected" data-scope="upper" type="button" role="radio" aria-checked="true">
                <div class="scope-tag">中上</div>
                <div class="scope-range">ㄅ ～ ㄖ</div>
                <div class="scope-count">共 18 個注音</div>
              </button>
              <button class="scope-card" data-scope="lower" type="button" role="radio" aria-checked="false">
                <div class="scope-tag">中下</div>
                <div class="scope-range">ㄗ ～ ㄦ</div>
                <div class="scope-count">共 19 個注音</div>
              </button>
              <button class="scope-card" data-scope="all" type="button" role="radio" aria-checked="false">
                <div class="scope-tag">全部注音</div>
                <div class="scope-range">ㄅ ～ ㄦ</div>
                <div class="scope-count">全部 37 個注音</div>
              </button>
            </div>
          </div>

          <!-- 第二區：題數與順序 -->
          <div class="setting-row">
            <div class="setting-block compact">
              <div class="setting-heading">2. 選擇題數</div>
              <div class="pill-group" id="count-options" role="radiogroup" aria-label="題數選擇">
                <button class="pill-btn selected" data-count="5" type="button" role="radio" aria-checked="true">⭐ 5 題（預設）</button>
                <button class="pill-btn" data-count="10" type="button" role="radio" aria-checked="false">10 題</button>
                <button class="pill-btn" data-count="all" type="button" role="radio" aria-checked="false" id="btn-count-all">全部（18 題）</button>
              </div>
            </div>

            <div class="setting-block compact">
              <div class="setting-heading">3. 出題順序</div>
              <div class="pill-group" id="order-options" role="radiogroup" aria-label="出題順序">
                <button class="pill-btn selected" data-order="random" type="button" role="radio" aria-checked="true">🎲 隨機出題</button>
                <button class="pill-btn" data-order="sequential" type="button" role="radio" aria-checked="false">📋 照順序</button>
              </div>
            </div>
          </div>
        </main>

        <!-- 開始按鈕與迎賓動物 -->
        <footer class="home-footer">
          <div class="home-animal home-animal-left" aria-hidden="true">
            <img class="animal-img" src="assets/animal-bear.png" alt="繪本小熊" draggable="false" />
          </div>

          <button id="btn-start" class="btn-start" type="button">
            <span class="btn-start-star">⭐</span>
            <span>開始集星星</span>
            <span class="btn-start-arrow">▶</span>
          </button>

          <div class="home-animal home-animal-right" aria-hidden="true">
            <img class="animal-img" src="assets/animal-bunny.png" alt="繪本小兔" draggable="false" />
          </div>
        </footer>
      </section>

      <!-- ==================== 畫面二：遊戲主畫面 ==================== -->
      <section id="screen-game" class="screen screen-game" aria-label="注音挑戰畫面">
        <!-- 頂部狀態列 -->
        <header class="game-topbar">
          <div class="topbar-left">
            <button id="btn-back-home" class="home-nav-btn" type="button" title="回到首頁">
              <span>🏠</span>
              <span>首頁</span>
            </button>
            <div id="game-scope-badge" class="mode-badge">中上 ㄅ～ㄖ</div>
          </div>

          <!-- 中央星星進度槽 -->
          <div id="star-progress-wrap" class="star-progress-wrap" aria-live="polite">
            <!-- 由 JS 動態填入星星槽或星星進度條 -->
          </div>

          <!-- 右上工具與題數 -->
          <div class="topbar-right">
            <div id="progress-pill" class="progress-pill">0 / 5 顆星</div>
            <button id="btn-font-game" class="util-btn icon-only" type="button" title="切換注音字體">
              <span class="util-icon font-toggle-short">黑</span>
            </button>
            <button id="btn-sound-game" class="util-btn icon-only sound-toggle-btn" type="button" title="開啟或關閉音效">
              <span class="util-icon sound-icon">🔊</span>
            </button>
            <button id="btn-fullscreen-game" class="util-btn icon-only fullscreen-btn" type="button" title="切換全螢幕">
              <span class="util-icon">⛶</span>
            </button>
          </div>
        </header>

        <!-- 中央主視覺：左右小動物 + 超大純注音卡 -->
        <main class="game-arena">
          <!-- 左側應援小動物 -->
          <div id="animal-left" class="stage-animal stage-animal-left">
            <div class="animal-bubble" id="bubble-left">好棒喔！⭐</div>
            <div class="animal-slot" id="animal-left-svg"></div>
          </div>

          <!-- 中央純注音木框大卡片 -->
          <div class="zhuyin-card-wrap">
            <div id="zhuyin-card" class="zhuyin-card">
              <div class="card-corner-star tl">✦</div>
              <div class="card-corner-star tr">✦</div>
              <div class="card-corner-star bl">✦</div>
              <div class="card-corner-star br">✦</div>
              <div id="zhuyin-symbol" class="zhuyin-symbol" aria-live="assertive">ㄅ</div>
            </div>
            <div id="card-hint-toast" class="card-hint-toast" aria-live="polite"></div>
          </div>

          <!-- 右側應援小動物 -->
          <div id="animal-right" class="stage-animal stage-animal-right">
            <div class="animal-bubble" id="bubble-right">太厲害了！✨</div>
            <div class="animal-slot" id="animal-right-svg"></div>
          </div>
        </main>

        <!-- 下方老師判定控制區（大觸控按鈕） -->
        <footer class="game-controls">
          <button id="btn-retry" class="control-btn btn-retry" type="button">
            <span class="ctrl-icon">🔄</span>
            <span class="ctrl-text">
              <span class="ctrl-main">換一題再挑戰</span>
              <span class="ctrl-sub">不扣星，換別的注音挑戰</span>
            </span>
          </button>

          <button id="btn-correct" class="control-btn btn-correct" type="button">
            <span class="ctrl-icon">⭐</span>
            <span class="ctrl-text">
              <span class="ctrl-main">唸對了！得星星</span>
              <span class="ctrl-sub">送出一顆閃亮星星</span>
            </span>
          </button>
        </footer>
      </section>

      <!-- ==================== 畫面三：過關頒獎畫面 ==================== -->
      <section id="screen-victory" class="screen screen-victory" aria-label="過關慶祝畫面">
        <div class="victory-content">
          <div class="victory-star-crown" aria-hidden="true">
            <span class="crown-star s-left">⭐</span>
            <span class="crown-star s-center">🌟</span>
            <span class="crown-star s-right">⭐</span>
          </div>

          <h2 id="victory-title" class="victory-title">太棒了！集滿 5 顆星星！</h2>
          <p id="victory-subtitle" class="victory-subtitle">森林小動物都為你拍拍手！</p>

          <!-- 四隻森林小動物大集合慶祝 -->
          <div id="victory-animals" class="victory-animals" aria-hidden="true"></div>

          <!-- 本回合複習注音總覽 -->
          <div class="review-box">
            <div class="review-label">✨ 這一輪一起唸過的注音 ✨</div>
            <div id="review-chips" class="review-chips"></div>
          </div>

          <!-- 底部大按鈕 -->
          <div class="victory-actions">
            <button id="btn-play-again" class="victory-btn btn-again" type="button">
              <span>🔄</span>
              <span>再玩一次</span>
            </button>
            <button id="btn-victory-home" class="victory-btn btn-home" type="button">
              <span>🏠</span>
              <span>回首頁換範圍</span>
            </button>
          </div>
        </div>
      </section>

      <!-- ==================== 返回首頁防誤觸確認視窗 ==================== -->
      <div id="modal-confirm" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
        <div class="modal-card">
          <div class="modal-icon">🏠</div>
          <h3 id="modal-title" class="modal-title">要回到首頁嗎？</h3>
          <p class="modal-desc">目前的星星進度會重新計算喔！</p>
          <div class="modal-actions">
            <button id="btn-modal-cancel" class="modal-btn btn-cancel" type="button">繼續集星星</button>
            <button id="btn-modal-ok" class="modal-btn btn-ok" type="button">回首頁</button>
          </div>
        </div>
      </div>

      <!-- 底部版權宣告 -->
      <footer class="site-copyright">© 傑尼爾教育文化事業集團 版權所有</footer>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
